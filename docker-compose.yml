services:
  db:
    image: postgres:16-alpine
    container_name: saluduoc-db
    environment:
      POSTGRES_USER: saluduoc
      POSTGRES_PASSWORD: saluduoc
      POSTGRES_DB: saluduoc
    ports:
      - "5434:5432"
    volumes:
      - saluduoc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saluduoc -d saluduoc"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-test:
    image: postgres:16-alpine
    container_name: saluduoc-db-test
    environment:
      POSTGRES_USER: saluduoc
      POSTGRES_PASSWORD: saluduoc
      POSTGRES_DB: saluduoc_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saluduoc -d saluduoc_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: saluduoc-app
    environment:
      # En este entorno de desarrollo el contenedor accede a Postgres por el
      # puerto publicado en el host. En un despliegue normal usar db:5432.
      DATABASE_URL: postgresql+psycopg://saluduoc:saluduoc@host.docker.internal:5434/saluduoc
      SECRET_KEY: cambia-esta-clave-en-produccion-32-chars
      ENV: dev
      COOKIE_SECURE: "false"
      TOKEN_TTL_MINUTES: "720"
      RATE_LIMIT_LOGIN: "5"
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

volumes:
  saluduoc_pgdata:
