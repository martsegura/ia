name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saluduoc
          POSTGRES_PASSWORD: saluduoc
          POSTGRES_DB: saluduoc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saluduoc -d saluduoc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://saluduoc:saluduoc@localhost:5432/saluduoc_test
      TEST_DATABASE_URL: postgresql+psycopg://saluduoc:saluduoc@localhost:5432/saluduoc_test
      SECRET_KEY: ci-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Migrar base de datos
        run: alembic upgrade head
      - name: Verificar que no hay drift de migraciones
        run: alembic check
      - name: Tests
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
