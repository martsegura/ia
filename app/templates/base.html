<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SaluDuoc{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css?v=0.1.0">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Salu<span>Duoc</span></a>
    <nav class="nav">
      <a href="/login">Iniciar sesión</a>
      <a class="btn btn-sm" href="/registro">Crear cuenta</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    SaluDuoc es un prototipo de apoyo a la categorización de urgencia. No reemplaza la evaluación de un profesional de la salud.
  </footer>

  <script src="/static/js/app.js?v=0.1.0"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
